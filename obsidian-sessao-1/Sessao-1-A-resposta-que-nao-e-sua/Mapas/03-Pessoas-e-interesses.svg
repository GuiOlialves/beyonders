<svg xmlns="http://www.w3.org/2000/svg" class="map-svg" viewBox="-110 -130 3360 2110" data-original="-110 -130 3360 2110"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#91a4b8"/></marker></defs><rect x="-60" y="-60" width="1560" height="450" rx="18" fill="#9483bb0c" stroke="#9483bb" stroke-width="2"/><text x="-44" y="-30" fill="#9483bb" font-family="system-ui" font-size="20" font-weight="700">CONTEXTO · conhecimento do mestre</text><rect x="-60" y="460" width="1560" height="950" rx="18" fill="#ba59650c" stroke="#ba5965" stroke-width="2"/><text x="-44" y="490" fill="#ba5965" font-family="system-ui" font-size="20" font-weight="700">CÉLULA LOCAL · preservar foco e registros</text><rect x="1640" y="-60" width="1560" height="1470" rx="18" fill="#659a810c" stroke="#659a81" stroke-width="2"/><text x="1656" y="-30" fill="#659a81" font-family="system-ui" font-size="20" font-weight="700">VÍTIMAS E ALIADOS</text><rect x="1640" y="1480" width="1560" height="450" rx="18" fill="#b59b550c" stroke="#b59b55" stroke-width="2"/><text x="1656" y="1510" fill="#b59b55" font-family="system-ui" font-size="20" font-weight="700">GANCHO PRÓXIMO</text><path d="M650 170.0 C710.0 170.0 710.0 705.0 770 705.0" fill="none" stroke="#9483bb" stroke-width="3" opacity=".7" marker-end="url(#arrow)"/><text x="710.0" y="428.5" text-anchor="middle" font-family="system-ui" font-size="17" fill="#c2d1df" stroke="#0b1421" stroke-width="6" paint-order="stroke">vestígio de influência</text><path d="M650 705.0 C710.0 705.0 710.0 705.0 770 705.0" fill="none" stroke="#ba5965" stroke-width="3" opacity=".7" marker-end="url(#arrow)"/><text x="710.0" y="696.0" text-anchor="middle" font-family="system-ui" font-size="17" fill="#c2d1df" stroke="#0b1421" stroke-width="6" paint-order="stroke">usa no experimento</text><path d="M1420 705.0 C1560.0 705.0 1560.0 170.0 1700 170.0" fill="none" stroke="#ba5965" stroke-width="3" opacity=".7" marker-end="url(#arrow)"/><text x="1560.0" y="428.5" text-anchor="middle" font-family="system-ui" font-size="17" fill="#c2d1df" stroke="#0b1421" stroke-width="6" paint-order="stroke">ligação incompleta</text><path d="M1420 1145.0 C1095.0 1145.0 1095.0 705.0 770 705.0" fill="none" stroke="#b59b55" stroke-width="3" opacity=".7" marker-end="url(#arrow)"/><text x="1095.0" y="916.0" text-anchor="middle" font-family="system-ui" font-size="17" fill="#c2d1df" stroke="#0b1421" stroke-width="6" paint-order="stroke">contém atividade local</text><path d="M3120 170.0 C2410.0 170.0 2410.0 170.0 1700 170.0" fill="none" stroke="#659a81" stroke-width="3" opacity=".7" marker-end="url(#arrow)"/><text x="2410.0" y="161.0" text-anchor="middle" font-family="system-ui" font-size="17" fill="#c2d1df" stroke="#0b1421" stroke-width="6" paint-order="stroke">abre contenções / oferece chave</text><path d="M3120 170.0 C2410.0 170.0 2410.0 705.0 1700 705.0" fill="none" stroke="#659a81" stroke-width="3" opacity=".7" marker-end="url(#arrow)"/><text x="2410.0" y="428.5" text-anchor="middle" font-family="system-ui" font-size="17" fill="#c2d1df" stroke="#0b1421" stroke-width="6" paint-order="stroke">quer resgatar</text><path d="M2350 705.0 C2025.0 705.0 2025.0 1145.0 1700 1145.0" fill="none" stroke="#659a81" stroke-width="3" opacity=".7" marker-end="url(#arrow)"/><text x="2025.0" y="916.0" text-anchor="middle" font-family="system-ui" font-size="17" fill="#c2d1df" stroke="#0b1421" stroke-width="6" paint-order="stroke">lembra nome e saída</text><path d="M3120 705.0 C2410.0 705.0 2410.0 170.0 1700 170.0" fill="none" stroke="#be8957" stroke-width="3" opacity=".7" marker-end="url(#arrow)"/><text x="2410.0" y="428.5" text-anchor="middle" font-family="system-ui" font-size="17" fill="#c2d1df" stroke="#0b1421" stroke-width="6" paint-order="stroke">barra passagem / pode negociar</text><path d="M2350 1145.0 C2025.0 1145.0 2025.0 1710.0 1700 1710.0" fill="none" stroke="#659a81" stroke-width="3" opacity=".7" marker-end="url(#arrow)"/><text x="2025.0" y="1418.5" text-anchor="middle" font-family="system-ui" font-size="17" fill="#c2d1df" stroke="#0b1421" stroke-width="6" paint-order="stroke">está alojado nos fundos</text><path d="M3120 1145.0 C2410.0 1145.0 2410.0 170.0 1700 170.0" fill="none" stroke="#659a81" stroke-width="3" opacity=".7" marker-end="url(#arrow)"/><text x="2410.0" y="648.5" text-anchor="middle" font-family="system-ui" font-size="17" fill="#c2d1df" stroke="#0b1421" stroke-width="6" paint-order="stroke">abrigo de Jeanne</text><path d="M3120 1710.0 C2410.0 1710.0 2410.0 1710.0 1700 1710.0" fill="none" stroke="#b59b55" stroke-width="3" opacity=".7" marker-end="url(#arrow)"/><text x="2410.0" y="1701.0" text-anchor="middle" font-family="system-ui" font-size="17" fill="#c2d1df" stroke="#0b1421" stroke-width="6" paint-order="stroke">endereço verificável</text><g  class="map-card"><rect x="0" y="20" width="650" height="300" rx="14" fill="#142336" stroke="#9483bb" stroke-width="3"/><text x="22" y="63" fill="#eef1f6" font-family="system-ui" font-size="24" font-weight="650">Delírio Inextinguível</text><text x="22" y="116" fill="#adbed0" font-family="system-ui" font-size="20"> A ameaça exterior. A presença desta aventura é um vestígio</text><text x="22" y="142" fill="#adbed0" font-family="system-ui" font-size="20">limitado; não há descida plena nesta sessão.</text></g><g data-note="M01-Verdade-oculta" class="map-card"><rect x="770" y="20" width="650" height="300" rx="14" fill="#142336" stroke="#9483bb" stroke-width="3"/><text x="792" y="63" fill="#eef1f6" font-family="system-ui" font-size="24" font-weight="650">A verdade oculta</text><text x="792" y="116" fill="#adbed0" font-family="system-ui" font-size="20"> O que aconteceu de fato</text><text x="792" y="298" fill="#9483bb" font-family="system-ui" font-size="17">ABRIR NOTA →</text></g><g data-note="N01-Elara-Voss" class="map-card"><rect x="0" y="540" width="650" height="330" rx="14" fill="#142336" stroke="#ba5965" stroke-width="3"/><text x="22" y="583" fill="#eef1f6" font-family="system-ui" font-size="24" font-weight="650">Dra. Elara Voss</text><text x="22" y="636" fill="#adbed0" font-family="system-ui" font-size="20">Papel: responsável local pelo experimento; personagem original.</text><text x="22" y="662" fill="#adbed0" font-family="system-ui" font-size="20">Ficha: T01-Combate-e-inimigos. Aparece: C01, depois C05 ou C06</text><text x="22" y="688" fill="#adbed0" font-family="system-ui" font-size="20">conforme o tempo.</text><text x="22" y="848" fill="#ba5965" font-family="system-ui" font-size="17">ABRIR NOTA →</text></g><g data-note="O01-Caderno-das-Respostas" class="map-card"><rect x="770" y="540" width="650" height="330" rx="14" fill="#142336" stroke="#ba5965" stroke-width="3"/><text x="792" y="583" fill="#eef1f6" font-family="system-ui" font-size="24" font-weight="650">Caderno das Respostas</text><text x="792" y="636" fill="#adbed0" font-family="system-ui" font-size="20">Objeto original, sem classificação oficial de artefato selado. Um</text><text x="792" y="662" fill="#adbed0" font-family="system-ui" font-size="20">caderno de capa escura, duas correias externas e páginas que</text><text x="792" y="688" fill="#adbed0" font-family="system-ui" font-size="20">conservam respostas incompletas. A instituição o usa como foco de</text><text x="792" y="714" fill="#adbed0" font-family="system-ui" font-size="20">uma iniciação experimental.</text><text x="792" y="848" fill="#ba5965" font-family="system-ui" font-size="17">ABRIR NOTA →</text></g><g data-note="P06-Sinais-da-organizacao" class="map-card"><rect x="0" y="980" width="650" height="330" rx="14" fill="#142336" stroke="#ba5965" stroke-width="3"/><text x="22" y="1023" fill="#eef1f6" font-family="system-ui" font-size="24" font-weight="650">P06 · Sinais da organização</text><text x="22" y="1076" fill="#adbed0" font-family="system-ui" font-size="20">Fontes: folheto na recepção, rubricas dos formulários e falas de</text><text x="22" y="1102" fill="#adbed0" font-family="system-ui" font-size="20">Jules/Voss. Entregar: H06-Folheto-do-instituto.</text><text x="22" y="1288" fill="#ba5965" font-family="system-ui" font-size="17">ABRIR NOTA →</text></g><g data-note="O02-Recipiente-de-transporte" class="map-card"><rect x="770" y="980" width="650" height="330" rx="14" fill="#142336" stroke="#b59b55" stroke-width="3"/><text x="792" y="1023" fill="#eef1f6" font-family="system-ui" font-size="24" font-weight="650">Recipiente de transporte</text><text x="792" y="1076" fill="#adbed0" font-family="system-ui" font-size="20">Caixa de madeira revestida de metal, com três correias numeradas.</text><text x="792" y="1102" fill="#adbed0" font-family="system-ui" font-size="20">Material original da campanha. Construída para conter a atividade</text><text x="792" y="1128" fill="#adbed0" font-family="system-ui" font-size="20">local do Caderno das Respostas; não é um escudo universal contra</text><text x="792" y="1154" fill="#adbed0" font-family="system-ui" font-size="20">influência exterior.</text><text x="792" y="1288" fill="#b59b55" font-family="system-ui" font-size="17">ABRIR NOTA →</text></g><g  class="map-card"><rect x="1700" y="20" width="650" height="300" rx="14" fill="#142336" stroke="#5c99b3" stroke-width="3"/><text x="1722" y="63" fill="#eef1f6" font-family="system-ui" font-size="24" font-weight="650">OS PERSONAGENS</text><text x="1722" y="116" fill="#adbed0" font-family="system-ui" font-size="20"> Sequência 9 · marca 1/6 · escapar, compreender e buscar</text><text x="1722" y="142" fill="#adbed0" font-family="system-ui" font-size="20">contenção. Caminhos escolhidos pelos jogadores.</text></g><g data-note="N02-Emilie-Renaud" class="map-card"><rect x="2470" y="20" width="650" height="300" rx="14" fill="#142336" stroke="#659a81" stroke-width="3"/><text x="2492" y="63" fill="#eef1f6" font-family="system-ui" font-size="24" font-weight="650">Émilie Renaud</text><text x="2492" y="116" fill="#adbed0" font-family="system-ui" font-size="20">Papel: funcionária que ajuda na fuga. Conhece: rotina e acessos</text><text x="2492" y="142" fill="#adbed0" font-family="system-ui" font-size="20">do instituto. Não conhece: natureza completa do culto. Pessoa</text><text x="2492" y="168" fill="#adbed0" font-family="system-ui" font-size="20">original.</text><text x="2492" y="298" fill="#659a81" font-family="system-ui" font-size="17">ABRIR NOTA →</text></g><g data-note="N03-Bastien-Morel" class="map-card"><rect x="1700" y="540" width="650" height="330" rx="14" fill="#142336" stroke="#659a81" stroke-width="3"/><text x="1722" y="583" fill="#eef1f6" font-family="system-ui" font-size="24" font-weight="650">Bastien Morel</text><text x="1722" y="636" fill="#adbed0" font-family="system-ui" font-size="20">Papel: paciente anterior, testemunha e pessoa a resgatar. Estado:</text><text x="1722" y="662" fill="#adbed0" font-family="system-ui" font-size="20">Vida atual 6/14; move 4 m apoiado, 6 m após cuidados. Não oferece</text><text x="1722" y="688" fill="#adbed0" font-family="system-ui" font-size="20">um caminho de cura completo.</text><text x="1722" y="848" fill="#659a81" font-family="system-ui" font-size="17">ABRIR NOTA →</text></g><g data-note="N04-Mael-Duroc" class="map-card"><rect x="2470" y="540" width="650" height="330" rx="14" fill="#142336" stroke="#be8957" stroke-width="3"/><text x="2492" y="583" fill="#eef1f6" font-family="system-ui" font-size="24" font-weight="650">Maël Duroc</text><text x="2492" y="636" fill="#adbed0" font-family="system-ui" font-size="20">Papel: responsável pela segurança de serviço. Arma: revólver,</text><text x="2492" y="662" fill="#adbed0" font-family="system-ui" font-size="20">seis cartuchos. Ficha: T01-Combate-e-inimigos. Não é um devoto</text><text x="2492" y="688" fill="#adbed0" font-family="system-ui" font-size="20">disposto ao martírio.</text><text x="2492" y="848" fill="#be8957" font-family="system-ui" font-size="17">ABRIR NOTA →</text></g><g data-note="N05-Lucien-Armand" class="map-card"><rect x="1700" y="980" width="650" height="330" rx="14" fill="#142336" stroke="#659a81" stroke-width="3"/><text x="1722" y="1023" fill="#eef1f6" font-family="system-ui" font-size="24" font-weight="650">Lucien Armand · Paciente 17</text><text x="1722" y="1076" fill="#adbed0" font-family="system-ui" font-size="20">Papel: sobrevivente anterior e objetivo do gancho final. Local:</text><text x="1722" y="1102" fill="#adbed0" font-family="system-ui" font-size="20">fundos da Encadernação Bellombre. Não é uma entidade, anjo</text><text x="1722" y="1128" fill="#adbed0" font-family="system-ui" font-size="20">escondido ou cura automática.</text><text x="1722" y="1288" fill="#659a81" font-family="system-ui" font-size="17">ABRIR NOTA →</text></g><g data-note="L02-Pensao-da-Agulha" class="map-card"><rect x="2470" y="980" width="650" height="330" rx="14" fill="#142336" stroke="#659a81" stroke-width="3"/><text x="2492" y="1023" fill="#eef1f6" font-family="system-ui" font-size="24" font-weight="650">Pensão da Agulha</text><text x="2492" y="1076" fill="#adbed0" font-family="system-ui" font-size="20">Local original. Uma pensão de trabalhadores com quartos sobre uma</text><text x="2492" y="1102" fill="#adbed0" font-family="system-ui" font-size="20">pequena oficina de costura. Émilie conhece a proprietária, Jeanne</text><text x="2492" y="1128" fill="#adbed0" font-family="system-ui" font-size="20">Mercier, porque já trabalhou consertando roupas para ela.</text><text x="2492" y="1288" fill="#659a81" font-family="system-ui" font-size="17">ABRIR NOTA →</text></g><g data-note="L03-Encadernacao-Bellombre" class="map-card"><rect x="1700" y="1560" width="650" height="300" rx="14" fill="#142336" stroke="#b59b55" stroke-width="3"/><text x="1722" y="1603" fill="#eef1f6" font-family="system-ui" font-size="24" font-weight="650">Encadernação Bellombre</text><text x="1722" y="1656" fill="#adbed0" font-family="system-ui" font-size="20">Endereço fictício: Passagem des Tisserands, nº 18, porta verde,</text><text x="1722" y="1682" fill="#adbed0" font-family="system-ui" font-size="20">fundos de uma papelaria. É o próximo destino investigável, não</text><text x="1722" y="1708" fill="#adbed0" font-family="system-ui" font-size="20">uma nova masmorra obrigatória nesta sessão.</text><text x="1722" y="1838" fill="#b59b55" font-family="system-ui" font-size="17">ABRIR NOTA →</text></g><g data-note="P04-Rota-Bellombre" class="map-card"><rect x="2470" y="1560" width="650" height="300" rx="14" fill="#142336" stroke="#b59b55" stroke-width="3"/><text x="2492" y="1603" fill="#eef1f6" font-family="system-ui" font-size="24" font-weight="650">P04 · Rota Bellombre</text><text x="2492" y="1656" fill="#adbed0" font-family="system-ui" font-size="20">Fontes estabelecidas: recibo no arquivo, ordem na sala do foco,</text><text x="2492" y="1682" fill="#adbed0" font-family="system-ui" font-size="20">segunda via no depósito e cópia de Émilie. Entregar:</text><text x="2492" y="1708" fill="#adbed0" font-family="system-ui" font-size="20">H04-Etiqueta-de-entrega.</text><text x="2492" y="1838" fill="#b59b55" font-family="system-ui" font-size="17">ABRIR NOTA →</text></g></svg>