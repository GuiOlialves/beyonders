<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111c29">
  <meta name="description" content="Suas fichas de Lord of the Mysteries. Vida, Sanidade, Espiritualidade, inventário e investigação, mesmo offline.">
  <title>Arquivo Beyonder — Fichas</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#ficha" class="brand" aria-label="Arquivo Beyonder, início">
      <span class="sigil" aria-hidden="true">✦</span>
      <span>ARQUIVO <b>BEYONDER</b><small>LORD OF THE MYSTERIES · RPG 0.1</small></span>
    </a>
    <span class="save-state" id="save-state" role="status">Salvo no aparelho</span>
    <button id="install" class="ghost small">Instalar no Android</button>
  </header>

  <div class="app-shell">
    <aside class="sidebar">
      <p class="eyebrow">SEU ARQUIVO</p>
      <label class="sr-only" for="character-select">Personagem ativo</label>
      <select id="character-select"></select>
      <button class="primary" data-action="new">+ Novo personagem</button>
      <nav aria-label="Seções da ficha">
        <a href="#ficha" data-tab="ficha"><span aria-hidden="true">◈</span> Ficha</a>
        <a href="#habilidades" data-tab="habilidades"><span aria-hidden="true">✧</span> Habilidades</a>
        <a href="#inventario" data-tab="inventario"><span aria-hidden="true">▣</span> Inventário</a>
        <a href="#diario" data-tab="diario"><span aria-hidden="true">≡</span> Diário</a>
        <a href="#dados" data-tab="dados"><span aria-hidden="true">⚄</span> Dados</a>
      </nav>
      <div class="sidebar-bottom">
        <button class="ghost" data-action="backup">Exportar backup</button>
        <button class="ghost" data-action="import">Importar fichas</button>
        <button class="ghost" data-action="help">Como usar</button>
        <p>O mistério fica com você.<br/>As fichas também.</p>
      </div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>

  <dialog id="dialog">
    <form id="modal-form">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button type="button" class="icon-btn" id="close-modal" aria-label="Fechar">×</button>
      </div>
      <div id="modal-content"></div>
      <div class="modal-actions">
        <button type="button" class="ghost" id="cancel-modal">Cancelar</button>
        <button type="submit" class="primary" id="submit-modal">Salvar</button>
      </div>
    </form>
  </dialog>

  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Ative JavaScript para preencher e salvar a ficha.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
